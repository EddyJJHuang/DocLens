# nginx site for doclens.eddyislearning.ai
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/.
# This is the HTTP (port 80) version; `certbot --nginx` rewrites it to add the
# 443 TLS server block and an 80->443 redirect.
server {
    listen 80;
    server_name doclens.eddyislearning.ai;

    # Static React build
    root /var/www/doclens.eddyislearning.ai/frontend/dist;
    index index.html;

    # SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri /index.html;
    }

    # API — proxy to the uvicorn backend. proxy_buffering off is required so the
    # /api/query Server-Sent Events stream is not buffered by nginx.
    location /api/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8005/health;
        proxy_set_header Host $host;
    }
}
